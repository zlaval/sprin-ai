spring:
  application:
    name: spring-ai-course
  ai:
    mcp:
      server:
        name: chat-memory-server
        type: SYNC
        protocol: STREAMABLE
        streamable-http:
          mcp-endpoint: /mcp
      client:
        name: chat-memory-client
        type: SYNC
        # The local MCP server must be running before the client connects.
        initialized: false
        toolcallback:
          enabled: false
        streamable-http:
          connections:
            chat-memory:
              url: ${MCP_CHAT_MEMORY_URL:http://localhost:${server.port:8080}}
              endpoint: /mcp
    model:
      chat: openai
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        temperature: 1.0
        model: gpt-4o-mini
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536
        max-document-batch-size: 10000
        initialize-schema: true
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: admin
    password: admin123
    driver-class-name: org.postgresql.Driver

logging.level:
  org.springframework: INFO
  org.springframework.ai.chat.client.advisor: DEBUG
#  org.springframework.ai.model.tool.DefaultToolCallingManager: DEBUG
